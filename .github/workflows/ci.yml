name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Compile
        run: ./gradlew --no-daemon compileJava

      # Native unit tests (JUnit 5): the pure static helpers — scope matcher, Net host-literal parser,
      # the §6.2 literal-coverage rules, the classification predicates — pinned at the method boundary.
      - name: Unit tests
        run: ./gradlew --no-daemon test

      # Behavioural end-to-end tests: the v0.2 report, the entry schema (hash/calls/fs), the queries,
      # the baseline guard, and cross-jar inheritance + version-trust. (build, run, assert.)
      - name: Smoke tests
        run: bash test/smoke.sh

      # Adversarial SOUNDNESS check: generate classes that thread a known effect through every JVM call
      # form (direct/lambda/method-ref/constructor/static-init/interface-dispatch/anon class), and assert
      # candor-java never reports a reachable method PURE (effect or Unknown only). Turns "never silently
      # under-reports" from a hope into a gate. Teeth-verified (reverting a fix fails its form's lane).
      - name: Soundness fuzzer
        run: bash soundness/run.sh 40

      # REENTRANCY gate: the engine's state lives in ~33 static accumulators; runScan() calls
      # resetState() before each scan so a second in-process scan starts clean. This proves it — an
      # in-process re-scan after an unrelated dirty scan must be byte-identical to a fresh-process scan.
      # Teeth-verified (removing resetState() leaks the dirty tree's functions and fails the diff).
      - name: Reentrancy (no state leak across in-process scans)
        run: bash soundness/reentrancy.sh

      # SELF-GATE (candor-spec §7.12): candor-java analyzes ITSELF and holds its own declared policy —
      # the analyzer reads bytecode and writes reports (Fs/Env). It must reach the network / a database /
      # IPC NOWHERE, and spawn a subprocess ONLY in `candor verify` (the honesty oracle runs your program).
      # Prefix scopes can't exclude one sub-package from a deny, so we prove the two halves separately:
      #   (1) the analyzer core (verify excluded) — no Net/Db/Exec/Ipc;  (2) the whole tool — no Net/Db/Ipc.
      # An effect-gate vendor whose own gate is red has no business gating anyone else.
      - name: Self-gate (candor-java on candor-java)
        run: |
          ./gradlew --no-daemon -q shadowJar
          JAR=$(ls build/libs/candor-java-*-all.jar)
          # (1) analyzer core — the one sanctioned subprocess surface (io.poly.candor.verify) removed — must not Exec.
          rm -rf /tmp/candor-core && cp -r build/classes/java/main /tmp/candor-core && rm -rf /tmp/candor-core/io/poly/candor/verify
          CANDOR_POLICY=.candor/policy java -jar "$JAR" /tmp/candor-core
          # (2) the whole tool (verify included) must still never reach the network, a database, or IPC.
          printf 'deny Net Db Ipc\n' > /tmp/candor-policy-notexec
          CANDOR_POLICY=/tmp/candor-policy-notexec java -jar "$JAR" build/classes/java/main

      # Kotlin-bytecode lane: Kotlin compiles the same semantics through different shapes (suspend/CPS,
      # indy lambdas, object/companion <clinit>, $default wrappers, callable refs, property getters,
      # extension + inline fns). KotlinProbe.kt threads a known effect through each; all 12 chains must
      # attribute. (The script self-skips when kotlinc is absent.)
      - name: Set up Kotlin
        # Pinned to a tag's commit SHA (not @main): a mutable branch in the job that builds the release
        # artifact and runs the self-gate is a supply-chain + reproducibility risk (/code-review).
        uses: fwilhe2/setup-kotlin@7163c92e0f906bdf586bd76b14143aa61d6b49e4 # v1.8
      - name: Soundness (kotlin forms)
        run: bash soundness/run_kotlin.sh

      # Dynamic oracle — the STRONGEST evidence tier (runtime ground truth, catches even a shared blind
      # spot the static engines all miss). Runs real programs under JDK Flight Recorder (Fs/Net via
      # jdk.{File,Socket}{Read,Write}) and a leaf-instrumenting -javaagent (Exec/Db/Env/Clock/Rand/Log),
      # then diffs the RUNTIME-observed per-method effects against candor's STATIC report. An effect that
      # really ran but candor's report neither predicts nor discloses (Unknown) is a confirmed model-gap
      # under-report; corpus.sh exits nonzero. This makes the runtime oracle a STANDING gate (was a manual
      # discovery tool). Reuses the shadowJar built by the self-gate step; builds the agent (pure javac,
      # ASM vendored in soundness/dynamic/agent/lib). Needs python3 + the `jfr` tool — both provided by
      # the ubuntu runner + setup-java.
      - name: Dynamic oracle (runtime ground truth — JFR + bytecode agent)
        run: |
          (cd soundness/dynamic/agent && bash build.sh)
          bash soundness/dynamic/corpus.sh
