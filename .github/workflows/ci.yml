name: ci

on:
  push:
  pull_request:
  # Recovery: a stalled Actions queue can orphan a push/PR-triggered run — created, never expanded
  # into jobs, `updated_at` == `created_at` hours later — and such a run is neither cancellable (409
  # "has not been queued yet") nor rerunnable. Measured 2026-08-26 on the 0.33.0 cut, where the same
  # stall hit tag-triggered workflows across three repos; this gate had no tag to delete/re-push, but
  # it also had no `workflow_dispatch`, so the only recovery was an empty commit to re-trigger `push`.
  workflow_dispatch:

jobs:
  # SOUNDNESS R339 — A SAFETY ASSERTION MUST ARRIVE WITH A TEST.
  #
  # Measured 2026-09-01 across the whole family in one round: four engines shipped ⟨0.35⟩ fixes, every
  # one carried a comment asserting a property, and every one of those claims turned out to be wrong —
  # one of them a cardinal sin introduced by the fix itself. Nobody verifies the sentence that makes
  # their own diff correct, which is why this is a gate and not a habit.
  #
  # (The wording above deliberately PARAPHRASES those claims rather than quoting them. This gate greps
  # ADDED LINES for assertion language, so a comment that QUOTES a false assertion as a cautionary
  # example trips it — measured: the first cut of this block cited one verbatim and failed its own gate
  # in all four engines. Describe the claim, do not reproduce it.)
  #
  # It does NOT judge whether an assertion is true — no grep can. It asks the cheaper question that would
  # have caught the real cases: you asserted safety, did you change a test in the same range?
  #
  # TRIAGED BEFORE BEING TURNED ON (2026-09-13, 120 commits across the four engines). 13 failed: 4 were
  # docs-only ranges, which the tool now SELF-SKIPS (exit 3 — visibly unjudged, never a pass), and 9
  # touched source and were the tool working. Four of those nine are the masking-guard commits R379,
  # R383 and R386, whose comments carried "under-catching is a missed mask, never a broken gate" — the
  # sentence SOUNDNESS R399 later proved false. This gate flagged them as they landed.
  #
  # Green on arrival: all four engines pass at HEAD, so this lands on no backlog.
  assert-audit:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: the audit reads a RANGE, and the default shallow clone has no parent to diff.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Workflow files GitHub can actually parse
        # THE DEFECT THIS CATCHES HAPPENED HERE, IN THIS FILE. An empty GitHub expression inside a shell
        # COMMENT made this ci.yml unparseable: no jobs ran, and the failure reported against the file
        # PATH rather than the workflow name. `yaml.safe_load` passes on it — it is valid YAML and
        # invalid Actions, and only the second validator runs on github.com.
        #
        # Run HERE rather than only in the umbrella, because this file exists only in this repo at push
        # time. An umbrella-only check is a decoration: found by review, which measured that the gate as
        # first wired could not see any of the four engine workflows it was written for.
        run: |
          # ONE SHARED CHECKOUT, FETCHED IDEMPOTENTLY. This step and the assert-audit step below both
          # need the umbrella's bin/, and they run in the SAME job with a shared /tmp — so a bare
          # `git clone` in whichever runs second dies with "destination path already exists" (exit 128).
          # That is exactly how candor-swift's CI failed on the commit that added this step, and it can
          # only surface in CI: `bin/gates.sh` marks both blocks `~`, so neither runs in a local gate list
          # and no amount of local verification could have caught it.
          [ -d /tmp/candor-tools/.git ] || git clone --depth 1 https://github.com/tombaldwin/candor /tmp/candor-tools
          CANDOR_ROOT="$(cd "$PWD/.." && pwd)" bash /tmp/candor-tools/bin/workflow-check.sh "$(basename "$PWD")"
      - name: Safety assertions must arrive with a test
        run: |
          set -u
          # The clone lives INSIDE this block on purpose. `bin/gates.sh` extracts every `run:` step so
          # `gate-run.sh` can replay a repo's CI locally, and a single-line `run:` is executed verbatim —
          # so a standalone clone step would put a NETWORK FETCH in every local gate run. Kept here, the
          # whole block carries GitHub expressions, is skipped locally as a block line, and still runs
          # in full in CI.
          #
          # AND DO NOT WRITE AN EMPTY EXPRESSION IN A COMMENT HERE. GitHub interpolates expressions
          # BEFORE the shell ever sees this file, so the empty one this line used to contain — written
          # to NAME the mechanism — was parsed as an expression, failed, and made the whole workflow
          # invalid: no jobs ran and all four engines reported the failure against the file PATH rather
          # than the workflow name. A comment about a mechanism triggered the mechanism.
          #
          # /tmp rather than a checkout under the workspace: a checkout inside this tree would dirty it,
          # and several gates in this family refuse a dirty tree. Same shape candor-ts already uses to
          # reach candor-spec.
          [ -d /tmp/candor-tools/.git ] || git clone --depth 1 https://github.com/tombaldwin/candor /tmp/candor-tools
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            case "$before" in
              ""|0000000000000000000000000000000000000000) range="HEAD~1..HEAD" ;;
              *) range="$before..HEAD" ;;
            esac
          fi
          echo "range: $range"
          # `set +e` DELIBERATELY. GitHub runs `run:` under `bash -e`, so without this the script aborts
          # on ANY non-zero before `rc` is ever read — including exit 3, the family's SELF-SKIP, which
          # would turn every docs-only commit into a CI failure. That is the imprecision this gate was
          # triaged to remove, reintroduced by the harness instead of the tool.
          set +e
          bash /tmp/candor-tools/bin/assert-audit.sh "$PWD" "$range"
          rc=$?
          set -e
          # An `if`, not `[ "$rc" = 3 ] && exit 0`: under `-e` that one-liner evaluates to FALSE whenever
          # rc is not 3, and a compound statement returning 1 fails the step — so the success path would
          # have failed too.
          if [ "$rc" = 3 ]; then
            echo "assert-audit self-skipped (docs-only range) — not a pass, and not a failure."
            exit 0
          fi
          exit "$rc"

  build-and-test:
    runs-on: ubuntu-latest
    # A deadline. With no `timeout-minutes` GitHub's 6-hour default applies, so a stuck runner
    # blocks the release gate (release-preflight [10] reads CI green on HEAD) while looking
    # exactly like a slow job — measured twice on 2026-08-19, at 3h45m and 54m. Gated by
    # release-preflight [7b], which asks every workflow in every released repo.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Compile
        run: ./gradlew --no-daemon compileJava

      # Native unit tests (JUnit 5): the pure static helpers — scope matcher, Net host-literal parser,
      # the §6.2 literal-coverage rules, the classification predicates — pinned at the method boundary.
      - name: Unit tests
        run: ./gradlew --no-daemon test

      # Behavioural end-to-end tests: the v0.2 report, the entry schema (hash/calls/fs), the queries,
      # the baseline guard, and cross-jar inheritance + version-trust. (build, run, assert.)
      - name: Smoke tests
        run: bash test/smoke.sh

      # Adversarial SOUNDNESS check: generate classes that thread a known effect through every JVM call
      # form (direct/lambda/method-ref/constructor/static-init/interface-dispatch/anon class), and assert
      # candor-java never reports a reachable method PURE (effect or Unknown only). Turns "never silently
      # under-reports" from a hope into a gate. Teeth-verified (reverting a fix fails its form's lane).
      - name: Soundness fuzzer
        run: bash soundness/run.sh 40

      # REENTRANCY gate: the engine's state lives in ~33 static accumulators; runScan() calls
      # resetState() before each scan so a second in-process scan starts clean. This proves it — an
      # in-process re-scan after an unrelated dirty scan must be byte-identical to a fresh-process scan.
      # Teeth-verified (removing resetState() leaks the dirty tree's functions and fails the diff).
      - name: Reentrancy (no state leak across in-process scans)
        run: bash soundness/reentrancy.sh

      # SELF-GATE (candor-spec §7.12): candor-java analyzes ITSELF and holds its own declared policy —
      # the analyzer reads bytecode and writes reports (Fs/Env). It must reach the network / a database /
      # IPC NOWHERE, and spawn a subprocess ONLY in `candor verify` (the honesty oracle runs your program).
      # Prefix scopes can't exclude one sub-package from a deny, so we prove the two halves separately —
      # see the step comment below and ci/self-gate.sh for the arrangement now in force. (This used to
      # read "(1) the analyzer core, verify EXCLUDED", which is the arrangement the self-gate rework
      # deleted precisely because excluding the package put it outside the Exec gate.)
      # An effect-gate vendor whose own gate is red has no business gating anyone else.
      - name: Self-gate (candor-java on candor-java)
        # Two halves, because a prefix deny can't say "deny Exec everywhere except io.poly.candor.verify":
        # the WHOLE tool under .candor/policy (`deny Net Db Ipc`, no package excluded), plus an assertion
        # that the Exec-performing methods are EXACTLY the two declared ones. This step used to make the
        # strict policy pass by copying build/classes and DELETING io/poly/candor/verify, which left that
        # whole package outside the Exec gate entirely. See ci/self-gate.sh.
        # ONE COMMAND PER STEP, deliberately — SOUNDNESS R406. As a `run: |` block these two lines were
        # invisible to `bin/gates.sh`, which extracts `run:` steps into the per-repo gate list: the block
        # was named as an un-run `~` line and `bash ci/self-gate.sh` appeared ZERO times among the
        # runnable gates. That is the exact gate CLAUDE.md's cautionary tale is about (candor-swift's
        # `main` sat red for four commits because self-gate was the one gate never run locally), and the
        # 0.36.1 cut did not run it either. Splitting changes nothing about what CI executes — same job,
        # same order, same shell — and makes both lines runnable by `bash bin/gate-run.sh candor-java`.
        run: ./gradlew --no-daemon -q shadowJar

      - name: Self-gate (candor-java on candor-java) — the gate itself
        run: bash ci/self-gate.sh

      # THE REFRESH CACHE'S ACCEPTANCE ORACLE, WHICH NOTHING RAN. bin/refresh-equiv.sh calls itself "the
      # refresh's entire safety case" and had no caller anywhere: not CI, not smoke.sh, not a gate. Found
      # while fixing SOUNDNESS R151, a silent under-report that lived in the digest that script exists to
      # defend. A safety case nobody runs is a document. Four seconds on this repo's own classes; it
      # needs the jar the step above builds.
      - name: Refresh-cache equivalence (report bytes, control, CANDOR_DEPS axis)
        run: |
          set -euo pipefail
          # Name the jar rather than trust a glob to hold exactly one entry: two *-all.jars would make
          # the second one a scan TARGET here, not an error. Same trap as the native parity step below.
          shopt -s nullglob
          JARS=(build/libs/*-all.jar)
          if [ "${#JARS[@]}" -ne 1 ]; then
            echo "expected exactly one build/libs/*-all.jar, found ${#JARS[@]}: ${JARS[*]:-<none>}" >&2
            exit 1
          fi
          bash bin/refresh-equiv.sh "${JARS[0]}" build/classes/java/main

      # SOUNDNESS R249 — THE HALF OF THE NATIVE PARITY GATE THAT NEEDS NO GRAALVM, RUN HERE SO IT RUNS ON
      # EVERY PUSH RATHER THAN ONLY IN `native`.
      #
      # candor bundles three gzipped classifier indexes as jar resources, each reaching the native image
      # through one `-H:IncludeResources` line in build.gradle.kts. A missing index does not fail, warn or
      # disclose — every loader degrades to an empty map, so the binary answers what it answered before
      # that index existed. `native.yml`'s parity check is the only thing that compares the two artifacts,
      # and it was measured BLIND to all three: stripping any of them left its target at 610 functions /
      # 1,397 analyzed with a byte-identical envelope, while its non-vacuousness control (>=100 functions,
      # >=500 analyzed) passed throughout — that control proves the SCAN found something, not that a
      # RESOURCE was consulted.
      #
      # `verifyNativeImageResources` compares the resources `processResources` really produced against the
      # `-H:IncludeResources` patterns the build really declares, in both directions, so a dropped or
      # mistyped line fails in seconds with no native-image toolchain. It also runs as a `processResources`
      # finalizer — it is named here as well because `candor/bin/gates.sh` prints `run:` steps, and a gate
      # reachable only as another task's side effect is invisible to the per-repo gate list.
      #
      # `native-parity-selftest.sh` is the other half: it hands the parity VERDICT a whole jar's report
      # against a stripped jar's report — the same asymmetry a native image built without an
      # `-H:IncludeResources` line produces — and requires it to go RED and to NAME the resource. A gate
      # nobody has watched fail is not a gate, and this is what watches it. It needs the shadow jar the
      # self-gate step above built.
      - name: Native-image resource declaration + parity-checker selftest (R249)
        run: |
          set -euo pipefail
          ./gradlew --no-daemon verifyNativeImageResources nativeParityClasses
          bash ci/native-parity-selftest.sh

      # Kotlin-bytecode lane: Kotlin compiles the same semantics through different shapes (suspend/CPS,
      # indy lambdas, object/companion <clinit>, $default wrappers, callable refs, property getters,
      # extension + inline fns). KotlinProbe.kt threads a known effect through each; all 12 chains must
      # attribute. (The script self-skips when kotlinc is absent.)
      - name: Set up Kotlin
        # Pinned to a tag's commit SHA (not @main): a mutable branch in the job that builds the release
        # artifact and runs the self-gate is a supply-chain + reproducibility risk (/code-review).
        uses: fwilhe2/setup-kotlin@7163c92e0f906bdf586bd76b14143aa61d6b49e4 # v1.8
      - name: Soundness (kotlin forms)
        run: bash soundness/run_kotlin.sh

      # Dynamic oracle — the STRONGEST evidence tier (runtime ground truth, catches even a shared blind
      # spot the static engines all miss). Runs real programs under JDK Flight Recorder (Fs/Net via
      # jdk.{File,Socket}{Read,Write}) and a leaf-instrumenting -javaagent (Exec/Db/Env/Clock/Rand/Log),
      # then diffs the RUNTIME-observed per-method effects against candor's STATIC report. An effect that
      # really ran but candor's report neither predicts nor discloses (Unknown) is a confirmed model-gap
      # under-report; corpus.sh exits nonzero. This makes the runtime oracle a STANDING gate (was a manual
      # discovery tool). Reuses the shadowJar built by the self-gate step; builds the agent (pure javac,
      # ASM vendored in soundness/dynamic/agent/lib). Needs python3 + the `jfr` tool — both provided by
      # the ubuntu runner + setup-java.
      - name: Dynamic oracle (runtime ground truth — JFR + bytecode agent)
        run: |
          (cd soundness/dynamic/agent && bash build.sh)
          bash soundness/dynamic/corpus.sh
