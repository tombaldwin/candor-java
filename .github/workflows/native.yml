name: native

# Build per-platform native `candor` binaries, PROVE THEM AGAINST THE JAR, and attach them to the
# GitHub release. The jar (jbang) stays the primary artifact; these are for fast-startup CLI use
# (CI gates, agent loops).
#
# THIS RUNS ON `main` AND ON PULL REQUESTS, NOT ONLY ON A RELEASE — a gate positioned after the
# irreversible step grades the release, it does not guard it. Until 2026-08-25 this workflow fired
# only on `release: published`, so the parity check below — the ONLY thing in the project that
# compares the native image's report against the jar's — first looked at a native binary after the
# release was public. On v0.32.0 it did its job and withheld two binaries that reported an EMPTY
# scan at exit 0 (0 functions where the jar found 210, `analyzed.count` 0 vs 1329), but by then
# v0.32.0 existed without them and the repair cost a second full family cut, 0.32.1, in which five
# engines were republished with no functional change. On `main` the same check costs one push.
#
# THE COST, MEASURED (job wall clock, both legs in parallel, 2026-08-25):
#   ubuntu-latest / linux-x64   2m47s      macos-latest / macos-arm64   3m40s
# so the workflow finishes in under four minutes and lands well inside `ci`'s own runtime. The repo
# is public, so standard runners — including the 10×-billed macOS one — are free. There is no cost
# argument for a schedule or a dispatch-only positioning here; it runs on every push to `main`.
#
# DELIBERATELY NO `paths:` FILTER. The defect this exists to catch was a MISSING RESOURCE FILE
# (`src/main/resources/META-INF/native-image/.../reflect-config.json`) — a path filter that failed to
# name that directory would skip precisely the gate that catches it, and a build this cheap does not
# buy anything by guessing. `push` is narrowed to `main` only because `pull_request` already covers
# branches; together they leave no route to `main` unmeasured.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# The repo's default GITHUB_TOKEN is read-only; attaching the native binaries to the release needs
# write. Scope it minimally to contents (the only write this workflow performs).
permissions:
  contents: write

# Supersede an in-flight PR build when the branch is pushed again — but NEVER cancel a release or a
# `main` build. Those two are the ones something downstream waits on: `release-preflight` [10] reads
# every run on the released commit's SHA, and a cancelled run is not `success`, so cancelling a
# `main` build would turn this guard into a release blocker on a race.
concurrency:
  group: native-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest      # Linux x64
            asset: candor-linux-x64
          - os: macos-latest       # macOS arm64
            asset: candor-macos-arm64
          # macOS x64 (Intel) dropped: the macos-13 runner reliably hangs in the queue and never
          # completes, stalling every release's native job (0.16 + 0.17). Apple Silicon + Linux cover
          # what `candor update` fetches; add it back only if an Intel binary is actually requested.
    runs-on: ${{ matrix.os }}
    # A deadline. With no `timeout-minutes` GitHub's 6-hour default applies, so a stuck runner
    # blocks the release gate (release-preflight [10] reads CI green on HEAD) while looking
    # exactly like a slow job — measured twice on 2026-08-19, at 3h45m and 54m. Gated by
    # release-preflight [7b], which asks every workflow in every released repo.
    timeout-minutes: 60
    steps:
      # DEFECT (code review, 2026-08-26): the upload condition below is `event_name == 'release' ||
      # startsWith(ref, 'refs/tags/')` — an exact complement with the artifact-upload step, so there is
      # no double-upload and no gap PROVIDED the operator selects a TAG in the workflow_dispatch ref
      # dropdown. Its default is `main`, and right after a cut `main`'s tip and the just-cut tag ARE the
      # same commit — the natural mistake. Left unguarded: build, parity and smoke all pass (they run
      # against a commit, not a ref), the job goes GREEN, and the upload is silently skipped — exactly
      # the original bug this trigger was added to fix. Worse, release-preflight [10] keys purely on
      # `headSha`, never on `ref` or `event_name`, so that green run satisfies the release gate as
      # evidence `native` passed while no binary reached the release.
      #
      # candor-swift's release.yml already has the safer pattern: it derives VER from `GITHUB_REF_NAME`
      # UNCONDITIONALLY, so a `main` dispatch fails LOUDLY (a branch name can never match
      # `candor-swift-<version>`). Same idea here — refuse outright, first step, before the ~3-4 minute
      # GraalVM build, rather than degrade to a silent skip.
      - name: Refuse a workflow_dispatch that is not against a tag ref
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        run: |
          echo "::error::workflow_dispatch was run against '${{ github.ref_name }}' (a branch), not a release tag."
          echo "::error::The upload step only fires for a tag ref or a 'release' event — dispatching against a branch builds, tests and smokes the binary and then SILENTLY SKIPS the upload, which is the exact recovery bug this trigger exists to fix."
          echo "::error::Fix: Actions -> native -> Run workflow, and pick the RELEASE TAG (e.g. v0.33.0) in the 'Use workflow from' ref dropdown -- not 'main'."
          exit 1

      - uses: actions/checkout@v6

      # TWO MORE workflow_dispatch-ONLY hazards, flagged in the same review: `softprops/action-gh-release@v2`
      # defaults to `overwrite_files: true`, so a dispatch against the WRONG (old) tag would silently
      # replace that historical release's binary with a non-reproducible rebuild made from today's
      # toolchain; and dispatching against a tag with no Release yet would CREATE one (non-draft, none of
      # the curated notes `release.sh`'s `rel` step writes) as a side effect of the upload action. Both are
      # ruled out here rather than accepted: workflow_dispatch is meant to recover an upload that never
      # completed for an ALREADY-CUT release, and both of those states are visible before the expensive
      # build runs.
      - name: Guard workflow_dispatch against the wrong tag
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "::error::no GitHub Release exists yet for tag $TAG."
            echo "::error::Dispatching here would CREATE one (non-draft, no curated notes) as a side effect of the upload step — this workflow only UPLOADS to a release that already exists."
            echo "::error::Fix: cut the release first (bin/release.sh), or re-dispatch against the tag that already has one."
            exit 1
          fi
          if gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "${{ matrix.asset }}"; then
            echo "::error::release $TAG already has a '${{ matrix.asset }}' asset."
            echo "::error::workflow_dispatch here is meant to recover an upload that never completed — this one already did. Re-dispatching would OVERWRITE it with a rebuild made today (softprops/action-gh-release defaults to overwrite_files: true), which is not reproducible and is probably the wrong tag."
            echo "::error::Fix: delete the asset from the release first if you really intend to replace it, or re-check which tag you meant to select."
            exit 1
          fi

      - name: Set up GraalVM (JDK 21)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      # SOUNDNESS R249 — FAIL BEFORE THE ~4-MINUTE BUILD, NOT AFTER IT. `verifyNativeImageResources`
      # compares the resources `processResources` really produced against the `-H:IncludeResources`
      # patterns this build really declares, in both directions. It also runs as a `processResources`
      # finalizer (so `nativeCompile` below cannot skip it), and it runs in `ci.yml` on every push where
      # there is no GraalVM at all — it is named here because a dropped line makes the expensive build
      # produce a binary that is wrong in the one way this workflow exists to catch.
      - name: Verify the native-image resource declaration (R249)
        run: ./gradlew --no-daemon verifyNativeImageResources

      - name: Build native image
        run: ./gradlew --no-daemon nativeCompile

      # SOUNDNESS GATE: the native binary resolves JDK supertypes from a bundled index, the jar from
      # ClassReader off the classpath — verify they produce IDENTICAL reports (whole envelope) on real
      # targets. A divergence = the native binary under/over-reports vs the jar; fail the build rather
      # than ship it.
      #
      # `nativeParityClasses` builds `src/nativeParity`, the R249 fixture: the second target below, whose
      # rows each index demonstrably changes.
      - name: Build jar + parity fixture (for parity check)
        run: ./gradlew --no-daemon shadowJar nativeParityClasses

      # SOUNDNESS R249 — TWO TARGETS, AND THE VERDICT NOW LIVES IN A FILE.
      #
      # WHAT WAS WRONG. This step used to be one target (`build/classes/java/main`) and an inline python
      # heredoc. The comparison was right — the whole envelope — and so was its non-vacuousness control
      # (the jar leg must find >=100 functions / >=500 analyzed). But that control proves the SCAN found
      # something, not that any bundled RESOURCE was consulted, and measured over that target, stripping
      # `candor/jdk-hof-invokes.idx.gz`, `candor/jdk-sams.idx.gz` or `candor/jdk-supertypes.idx.gz` left
      # 610 functions / 1,397 analyzed and a byte-identical envelope EVERY TIME. Three
      # `-H:IncludeResources` lines, and deleting any one of them was invisible to the only gate that
      # compares the two artifacts. A missing index is silent — no exit code, no stderr, no disclosure —
      # so nothing else would have caught it either.
      #
      # WHAT CHANGED. `main` is kept exactly as it was: it is the broad target, and it is what caught
      # ⟨0.32⟩'s empty-report native binary. `fixture` is the new one — `src/nativeParity`, built so each
      # index changes a NAMED ROW — and `ci/native-parity.py` checks those marker rows on BOTH LEGS
      # before comparing envelopes, so a missing resource is reported as "this row is absent, that
      # resource is why" rather than as an unexplained diff.
      #
      # AND THE VERDICT IS A FILE BECAUSE A HEREDOC CANNOT BE ATTACKED. `ci/native-parity-selftest.sh`
      # (run in `ci.yml`, no GraalVM needed) feeds the same checker a whole jar's report against a
      # stripped jar's report and requires RED — the asymmetry a native image built without an
      # `-H:IncludeResources` line produces. The engine run is upstream of the comparison, so its cost is
      # not the comparison's cost (corpus brief §M).
      #
      # DELIBERATELY NOT A LOOP over the two targets: an aggregator's worst failure is running zero
      # times and reporting zero failures. Two explicit blocks under `set -e` cannot do that.
      - name: Parity — native report == jar report (candor's classes, and the R249 index fixture)
        run: |
          set -euo pipefail
          # Name the jar rather than trust a glob to hold exactly one entry: a build dir carrying two
          # `*-all.jar`s makes `ls` expand to two words and compares against whichever the shell put
          # first — a measurement of the wrong artifact, not a parity result.
          shopt -s nullglob
          JARS=(build/libs/*-all.jar)
          if [ "${#JARS[@]}" -ne 1 ]; then
            echo "expected exactly one build/libs/*-all.jar, found ${#JARS[@]}: ${JARS[*]:-<none>}" >&2
            exit 1
          fi
          JAR="${JARS[0]}"
          NATIVE=./build/native/nativeCompile/candor

          # [1] candor's own compiled classes — the broad envelope check, unchanged.
          "$NATIVE" build/classes/java/main --json /tmp/native-main.json
          java -jar "$JAR" build/classes/java/main --json /tmp/jar-main.json
          python3 ci/native-parity.py --jar /tmp/jar-main.json --native /tmp/native-main.json --profile main

          # [2] the R249 fixture — the target that can actually move when an index goes missing.
          "$NATIVE" build/classes/java/nativeParity --json /tmp/native-fixture.json
          java -jar "$JAR" build/classes/java/nativeParity --json /tmp/jar-fixture.json
          python3 ci/native-parity.py --jar /tmp/jar-fixture.json --native /tmp/native-fixture.json --profile fixture

      - name: Stage binary
        run: |
          mkdir -p dist
          cp build/native/nativeCompile/candor "dist/${{ matrix.asset }}"

      - name: Smoke-test the binary
        run: ./dist/${{ matrix.asset }} --version

      # The release step is now an UPLOAD OF SOMETHING ALREADY PROVEN: the identical build ran on the
      # `main` commit this tag points at, and its parity check was green before anyone cut anything.
      # The build and the parity check above still run here — the upload is the only release-only step
      # in this file, because uploading is the only thing that genuinely cannot happen before there is
      # a release to upload to.
      #
      # ALSO fires on a `workflow_dispatch` run against a TAG ref — the recovery path, not just the
      # release event. Measured 2026-08-26 on the 0.33.0 cut: a stalled Actions queue orphaned this
      # workflow's `release`-triggered run (created, never expanded into jobs, uncancellable —
      # 409 "has not been queued yet" — and unrerunnable), so it was recovered with a manual dispatch
      # against the release tag. The dispatch went GREEN, but `github.event_name` there is
      # `workflow_dispatch`, never `release`, so this step's original `== 'release'` condition silently
      # skipped the only step that mattered: the binary never reached the release. Gating on the REF
      # SHAPE as well as the event catches exactly that recovery dispatch (its ref is `refs/tags/*`)
      # while leaving ordinary `main`/PR runs — whose ref is never a tag — unaffected.
      - name: Upload to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}

      # Every non-release run leaves the binary downloadable — a `main` build that a later release
      # merely re-cuts, or a PR build someone wants to try. Was `== 'workflow_dispatch'`, which under
      # the new triggers would have thrown away every `main` and PR binary. Kept as the exact
      # complement of the condition above (event `release` OR a tag ref) — a tag-ref dispatch used to
      # recover a stalled release should upload to the release, not leave a duplicate workflow artifact.
      - name: Upload as workflow artifact
        if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
