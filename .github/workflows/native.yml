name: native

# Build per-platform native `candor` binaries and attach them to the GitHub release.
# The jar (jbang) stays the primary artifact; these are for fast-startup CLI use (CI gates, agent loops).
on:
  release:
    types: [published]
  workflow_dispatch:

# The repo's default GITHUB_TOKEN is read-only; attaching the native binaries to the release needs
# write. Scope it minimally to contents (the only write this workflow performs).
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest      # Linux x64
            asset: candor-linux-x64
          - os: macos-latest       # macOS arm64
            asset: candor-macos-arm64
          # macOS x64 (Intel) dropped: the macos-13 runner reliably hangs in the queue and never
          # completes, stalling every release's native job (0.16 + 0.17). Apple Silicon + Linux cover
          # what `candor update` fetches; add it back only if an Intel binary is actually requested.
    runs-on: ${{ matrix.os }}
    # A deadline. With no `timeout-minutes` GitHub's 6-hour default applies, so a stuck runner
    # blocks the release gate (release-preflight [10] reads CI green on HEAD) while looking
    # exactly like a slow job — measured twice on 2026-08-19, at 3h45m and 54m. Gated by
    # release-preflight [7b], which asks every workflow in every released repo.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up GraalVM (JDK 21)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Build native image
        run: ./gradlew --no-daemon nativeCompile

      # SOUNDNESS GATE: the native binary resolves JDK supertypes from a bundled index, the jar from
      # ClassReader off the classpath — verify they produce IDENTICAL reports (functions[]) on a real
      # target (candor's own compiled classes, always present in CI). A divergence = the native binary
      # under/over-reports vs the jar; fail the build rather than ship it.
      - name: Build jar (for parity check)
        run: ./gradlew --no-daemon shadowJar

      - name: Parity — native report == jar report
        run: |
          set -euo pipefail
          # Name the jar rather than trust a glob to hold exactly one entry: a build dir carrying two
          # `*-all.jar`s makes `ls` expand to two words and compares against whichever the shell put
          # first — a measurement of the wrong artifact, not a parity result.
          shopt -s nullglob
          JARS=(build/libs/*-all.jar)
          if [ "${#JARS[@]}" -ne 1 ]; then
            echo "expected exactly one build/libs/*-all.jar, found ${#JARS[@]}: ${JARS[*]:-<none>}" >&2
            exit 1
          fi
          JAR="${JARS[0]}"
          TARGET=build/classes/java/main
          ./build/native/nativeCompile/candor "$TARGET" --json /tmp/native.json
          java -jar "$JAR" "$TARGET" --json /tmp/jar.json
          python3 - <<'PY'
          import json, sys
          jar = json.load(open('/tmp/jar.json'))
          nat = json.load(open('/tmp/native.json'))

          # THE CONTROL, AND IT IS NOT OPTIONAL. This gate is an EQUALITY, and two empty documents are
          # equal — so a defect that zeroes BOTH legs passes it while measuring nothing. The jar leg has
          # to be shown to have found something before its agreement with native means anything.
          # candor's own classes reach Fs/Exec/Env/Clock in the hundreds.
          n = len(jar.get('functions', []))
          count = jar.get('analyzed', {}).get('count', 0)
          if n < 100 or count < 500:
              print(f'PARITY VACUOUS: the jar leg found {n} function(s) / {count} analyzed — this gate '
                    f'would be comparing two empty reports. Fix the scan, not the gate.', file=sys.stderr)
              sys.exit(1)

          # THE WHOLE ENVELOPE, not just `functions`. ⟨0.32⟩ shipped a native image whose per-class delta
          # merge folded nothing: `functions` went to 0, AND `analyzed.count` 1329 -> 0, AND `coverage`
          # vanished. `functions` caught that one — but a divergence confined to `analyzed`, `excluded`,
          # `outOfScope` or `netPartners` would have passed a functions-only gate, and a consumer's
          # verdict reads every one of those keys.
          bad = [k for k in sorted(set(jar) | set(nat))
                 if jar.get(k, '<ABSENT>') != nat.get(k, '<ABSENT>')]
          if bad:
              print(f'PARITY FAILED: native report differs from jar on {bad}', file=sys.stderr)
              for k in bad:
                  a, b = jar.get(k, '<ABSENT>'), nat.get(k, '<ABSENT>')
                  if k == 'functions' and isinstance(a, list) and isinstance(b, list):
                      an = {f['fn']: f for f in a}
                      bn = {f['fn']: f for f in b}
                      print(f'  functions: jar {len(an)} vs native {len(bn)}', file=sys.stderr)
                      for fn in sorted(set(an) ^ set(bn))[:10]:
                          print(f'    only in {"jar" if fn in an else "native"}: {fn}', file=sys.stderr)
                      for fn in sorted(set(an) & set(bn)):
                          if an[fn] != bn[fn]:
                              print(f'    differs: {fn}\n      jar   : {an[fn]}\n      native: {bn[fn]}',
                                    file=sys.stderr)
                              break
                  else:
                      print(f'  {k}:\n    jar   : {json.dumps(a)[:300]}\n    native: {json.dumps(b)[:300]}',
                            file=sys.stderr)
              sys.exit(1)
          print(f'parity OK: native report == jar, whole envelope ({n} functions, {count} analyzed)')
          PY

      - name: Stage binary
        run: |
          mkdir -p dist
          cp build/native/nativeCompile/candor "dist/${{ matrix.asset }}"

      - name: Smoke-test the binary
        run: ./dist/${{ matrix.asset }} --version

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}

      - name: Upload as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
